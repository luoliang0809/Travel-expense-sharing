<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>记一笔 | 旅行分账</title>
  <meta name="description" content="进入旅行后，先记一笔。快速记录分类、金额、付款人、参与人和分摊方式。">
  <meta id="metaKeywords" name="keywords" content="记一笔,旅行记账,多人分账">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="bill">
  <main class="app-shell">
    <section class="phone-page">
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons"><span></span><span></span><span></span></div>
      </div>

      <header class="page-header">
        <button class="nav-icon" type="button" aria-label="返回">‹</button>
        <h1>记一笔</h1>
        <button class="nav-icon more" type="button" aria-label="更多">•••</button>
      </header>

      <div class="seg-switch" data-toggle-group="billType">
        <button class="seg-btn active" type="button" data-bill-type="expense">支出</button>
        <button class="seg-btn" type="button" data-bill-type="income">收入</button>
      </div>

      <section id="categoryGrid" class="category-grid">
        <button class="category-btn active" data-category="交通" type="button"><span class="icon-bubble red">车</span><b>交通</b></button>
        <button class="category-btn" data-category="住宿" type="button"><span class="icon-bubble blue">床</span><b>住宿</b></button>
        <button class="category-btn" data-category="餐饮" type="button"><span class="icon-bubble orange">叉</span><b>餐饮</b></button>
        <button class="category-btn" data-category="门票" type="button"><span class="icon-bubble green">票</span><b>门票</b></button>
        <button class="category-btn" data-category="购物" type="button"><span class="icon-bubble yellow">袋</span><b>购物</b></button>
        <button class="category-btn" data-category="娱乐" type="button"><span class="icon-bubble purple">游</span><b>娱乐</b></button>
        <button class="category-btn" data-category="通讯" type="button"><span class="icon-bubble teal">讯</span><b>通讯</b></button>
        <button class="category-btn" data-category="其他" type="button"><span class="icon-bubble gray">…</span><b>其他</b></button>
      </section>

      <section class="sheet-card">
        <div id="billEditBanner" class="edit-banner hidden">
          <span id="billEditText">正在编辑一笔账单</span>
          <button id="cancelEditBillBtn" class="mini-plain-btn" type="button">取消编辑</button>
        </div>

        <div class="amount-card">
          <span class="field-label">金额</span>
          <div class="amount-main">
            <input id="billAmount" class="amount-input" type="number" step="0.01" min="0" placeholder="0.00">
            <span class="camera-btn">◉</span>
          </div>
        </div>

        <label class="note-card">
          <span class="field-label">备注</span>
          <input id="billNote" type="text" maxlength="30" placeholder="比如：沙坡尾海鲜大餐 😋">
        </label>

        <label class="line-field">
          <span class="field-label">谁支付</span>
          <div class="field-main select-wrap">
            <select id="paidBy"></select>
          </div>
          <span class="field-arrow">›</span>
        </label>

        <div class="line-field block-row">
          <span class="field-label">参与人</span>
          <div id="participantChips" class="avatar-chip-row compact"></div>
          <span class="field-tip">旅行成员</span>
        </div>

        <div class="line-field block-row">
          <span class="field-label">分摊方式</span>
          <div class="chip-row" data-toggle-group="splitMode">
            <button class="chip active" data-split-mode="equal" type="button">平均分摊</button>
            <button class="chip" data-split-mode="custom" type="button">自定义金额</button>
          </div>
        </div>

        <div id="customSplitWrap" class="custom-split hidden"></div>
      </section>

      <button id="saveBillBtn" class="primary-cta orange-cta" type="button">保存</button>
      <p id="billStatusText" class="tip-text center-tip">理想状态下，30 秒记完一笔，不打断旅行节奏。</p>

      <div class="keyword-area">
        <div class="keyword-tags" data-keywords="bill"></div>
      </div>

      <nav class="app-tabbar trip-tabbar" aria-label="页面导航">
        <a class="active" href="./add-bill.html"><span class="tab-ico">✎</span><span>记一笔</span></a>
        <a href="./overview.html"><span class="tab-ico">◔</span><span>账目总览</span></a>
        <a href="./settlement.html"><span class="tab-ico">✓</span><span>一键结算</span></a>
      </nav>
    </section>
  </main>

  <script id="structured-data" type="application/ld+json"></script>
  <script src="./script.js"></script>
</body>
</html>
