<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>记一笔 | 旅行分账</title>
  <meta name="description" content="快速记一笔旅行消费，支持分类、金额、付款人、参与人和均摊或自定义分摊。">
  <meta id="metaKeywords" name="keywords" content="记一笔,随手记一笔,AA均摊,付款人,参与人,自定义金额">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="bill">
  <main class="mobile-page">
    <section class="phone-frame">
      <header class="page-header">
        <a class="mini-link" href="./index.html">返回创建</a>
        <div class="brand-badge">02 记一笔</div>
      </header>

      <section class="card bill-top-card">
        <div class="seg-row" data-toggle-group="billType">
          <button class="seg-btn active" type="button" data-bill-type="expense">支出</button>
          <button class="seg-btn" type="button" data-bill-type="income">收入</button>
        </div>

        <div class="category-grid" id="categoryGrid">
          <button class="category-btn active" data-category="交通" type="button"><span class="icon red">🚗</span><b>交通</b></button>
          <button class="category-btn" data-category="住宿" type="button"><span class="icon blue">🛏</span><b>住宿</b></button>
          <button class="category-btn" data-category="餐饮" type="button"><span class="icon orange">🍴</span><b>餐饮</b></button>
          <button class="category-btn" data-category="门票" type="button"><span class="icon green">🎫</span><b>门票</b></button>
          <button class="category-btn" data-category="购物" type="button"><span class="icon yellow">🛍</span><b>购物</b></button>
          <button class="category-btn" data-category="娱乐" type="button"><span class="icon purple">🎮</span><b>娱乐</b></button>
          <button class="category-btn" data-category="通讯" type="button"><span class="icon teal">📞</span><b>通讯</b></button>
          <button class="category-btn" data-category="其他" type="button"><span class="icon gray">•••</span><b>其他</b></button>
        </div>
      </section>

      <section class="card form-card">
        <div id="billEditBanner" class="edit-banner hidden">
          <span id="billEditText">正在编辑一笔账单</span>
          <button id="cancelEditBillBtn" class="ghost-btn slim-btn" type="button">取消编辑</button>
        </div>

        <label class="field amount-field">
          <span>金额</span>
          <input id="billAmount" class="amount-input" type="number" step="0.01" min="0" placeholder="0.00">
        </label>

        <label class="field">
          <span>备注</span>
          <input id="billNote" type="text" maxlength="30" placeholder="比如：沙坡尾海鲜大餐">
        </label>

        <label class="field">
          <span>谁支付</span>
          <select id="paidBy"></select>
        </label>

        <div class="field">
          <div class="field-head">
            <span>参与人</span>
            <small>默认全员参与</small>
          </div>
          <div id="participantChips" class="chip-row"></div>
        </div>

        <div class="field">
          <div class="field-head">
            <span>分摊方式</span>
            <small>可均摊，也可自己填</small>
          </div>
          <div class="chip-row" data-toggle-group="splitMode">
            <button class="chip active" data-split-mode="equal" type="button">AA均摊</button>
            <button class="chip" data-split-mode="custom" type="button">自定义金额</button>
          </div>
        </div>

        <div id="customSplitWrap" class="custom-split hidden"></div>

        <button id="saveBillBtn" class="primary-btn" type="button">保存</button>
        <p id="billStatusText" class="tiny-text">30 秒记完，不打断旅行节奏。</p>
      </section>

      <section class="keyword-section">
        <h3>记账动作覆盖</h3>
        <div class="keyword-tags" data-keywords="bill"></div>
      </section>

      <nav class="bottom-nav" aria-label="页面导航">
        <a href="./index.html">创建旅行</a>
        <a class="active" href="./add-bill.html">记一笔</a>
        <a href="./overview.html">账目总览</a>
        <a href="./settlement.html">一键结算</a>
      </nav>
    </section>
  </main>

  <script id="structured-data" type="application/ld+json"></script>
  <script src="./script.js"></script>
</body>
</html>
