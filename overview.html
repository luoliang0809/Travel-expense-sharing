<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>账目总览 | 旅行分账</title>
  <meta name="description" content="进入旅行后，查看总支出、人均支出、账单笔数和谁该收谁该付。">
  <meta id="metaKeywords" name="keywords" content="账目总览,总支出,人均支出,谁该收谁该付">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="overview">
  <main class="app-shell">
    <section class="phone-page">
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons"><span></span><span></span><span></span></div>
      </div>

      <header class="page-header">
        <button class="nav-icon" type="button" aria-label="返回">‹</button>
        <h1>账目总览</h1>
        <a class="nav-icon share-link" href="./settlement.html" aria-label="去结算">⤴</a>
      </header>

      <section class="overview-hero">
        <img src="./overview-banner.png" alt="旅行总览头图">
        <div class="overview-hero-copy">
          <div>
            <h2 id="overviewTripName">还没有旅行</h2>
            <p id="overviewTripMeta">先去创建旅行并记一笔</p>
          </div>
          <span class="manage-chip">管理</span>
        </div>
        <div id="overviewMembers" class="member-avatar-row overlay"></div>
      </section>

      <section class="stat-cards-grid">
        <article class="stat-card">
          <span>总支出</span>
          <strong id="totalExpense">¥ 0.00</strong>
        </article>
        <article class="stat-card">
          <span>人均支出</span>
          <strong id="avgExpense">¥ 0.00</strong>
        </article>
        <article class="stat-card">
          <span>账单笔数</span>
          <strong id="billCountText">0 笔</strong>
        </article>
      </section>

      <section class="sheet-card">
        <div class="block-title">支出分类</div>
        <div class="chart-section">
          <div class="donut-wrap">
            <div id="donutChart" class="donut-chart"><span>还没记账</span></div>
          </div>
          <div id="categoryLegend" class="legend-list"></div>
        </div>
      </section>

      <section class="sheet-card">
        <div class="list-title">谁该收，谁该付</div>
        <div id="settlePreview" class="list-stack empty-stack">
          <p class="empty-text">先记账后才能看到谁该收、谁该付。</p>
        </div>
      </section>

      <section class="sheet-card">
        <div class="block-head-line">
          <div class="list-title">最新账单</div>
          <a class="tiny-link" href="./add-bill.html">去补一笔</a>
        </div>
        <div id="expenseList" class="list-stack empty-stack">
          <p class="empty-text">还没有账单，先去记一笔。</p>
        </div>
      </section>

      <div class="keyword-area">
        <div class="keyword-tags" data-keywords="overview"></div>
      </div>

      <nav class="app-tabbar trip-tabbar" aria-label="页面导航">
        <a href="./add-bill.html"><span class="tab-ico">✎</span><span>记一笔</span></a>
        <a class="active" href="./overview.html"><span class="tab-ico">◔</span><span>账目总览</span></a>
        <a href="./settlement.html"><span class="tab-ico">✓</span><span>一键结算</span></a>
      </nav>
    </section>
  </main>

  <script id="structured-data" type="application/ld+json"></script>
  <script src="./script.js"></script>
</body>
</html>
